<style>
	/* =========================
   ANIMATED BACKGROUND
   ========================= */

.animated-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 80%;
    height: 100%;
    pointer-events: none;
}

.line {
    position: fixed;
    z-index: -1;
    border-radius: 3px;
    width: 200px;
    height: 12px;
    background-color: #90D5FF;
    animation: moveLine 5s linear infinite;
}

@keyframes moveLine {
    0% {
        transform: translate(0, 0) rotate(135deg);
        opacity: 1;
    }

    100% {
        transform: translate(100px, -100px) rotate(135deg);
        opacity: 0;
    }
}

.line:nth-child(odd) {
    animation-duration: 2.5s;
}

.line:nth-child(even) {
    animation-duration: 3s;
}

button {
    width: 75px;
    height: 30px;
    font-size: 12px;
}

#CloseButton {

    height: 25px;
    font-size: 10px;
}
summary {

}
button {

body {
    font-family: Georgia, serif;
}
</style>

<!--If you truly need to tocuh things here or need to understand how they work, basically the Javascript makes the animation in the background in the "Animated Background" section.-->
<script>
document.addEventListener('DOMContentLoaded', () => {

    /* =========================
       ANIMATED BACKGROUND
       ========================= */

    const numLines = 120;
    const animatedBackground = document.querySelector('.animated-background');

    for (let i = 0; i < numLines; i++) {
        const line = document.createElement('div');

        line.classList.add('line');
        line.style.left = `${Math.random() * 100}%`;
        line.style.top = `${Math.random() * 100}%`;

        animatedBackground.appendChild(line);
    }
});
</script>
